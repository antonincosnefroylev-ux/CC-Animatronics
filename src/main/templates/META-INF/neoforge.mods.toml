# The (!) symbol means info #

#======== Loader ========#
modLoader="javafml"
loaderVersion="${fml_loader_version_range}"

#======== License ========#
license="${mod_license}"

#======== Mixins ========#
#[[mixins]]
#config="${mod_id}.mixins.json"

#======== Mods properties ========#
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${mod_description}'''
# (!) Possible options for future updates #
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
#logoFile="examplemod.png" #optional
#credits="" #optional

#======== Dependencies ========#
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    type="required"
    versionRange="${computercraft_version}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="simulated"
    type="optional"
    versionRange="${simulated_version}"
    ordering="AFTER"
    side="BOTH"
